<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen y Prácticas: Sistemas y Circuitos Eléctricos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --success-border: #a7f3d0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .question-source {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .images-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: block;
        }

        .img-placeholder {
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            padding: 1.5rem;
            text-align: center;
            color: #9ca3af;
            border-radius: 8px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        textarea.workspace {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            background-color: #f9fafb;
            transition: border-color 0.2s ease;
        }

        textarea.workspace:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .btn-toggle {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-toggle:hover {
            background-color: var(--primary-hover);
        }

        .answer-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 8px;
            color: var(--success-text);
            display: none;
        }

        .answer-box.visible {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .answer-box h4 {
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            color: #047857;
        }

        table.circuit-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
        }
        
        table.circuit-table th, table.circuit-table td {
            border: 1px solid var(--success-border);
            padding: 0.5rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Examen de Circuitos Eléctricos</h1>
        <p class="subtitle">Resuelve los cálculos en el recuadro. Tu progreso se guardará automáticamente en tu navegador.</p>
    </header>

    <div id="quiz-container"></div>
</div>

<script>
    // Base de datos de preguntas extraídas y resueltas de los PDFs
    // Se ha modificado "imagenes" a un array para soportar múltiples imágenes (reducciones) por pregunta.
    const preguntas = [
        // ================= PDF: EJERCICIOS REPASO CORRIENTE CONTINUA 1 =================
        // Las imágenes 01 a 22 se mapean exactamente al orden del PDF.
        {
            id: "rep1_1_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 1.1: De acuerdo al circuito, ¿cuánta corriente produciría un voltaje aplicado de 10 volts a través de una resistencia de 5 ohms?",
            imagenes: ["img/01.png"],
            respuesta: "<strong>Solución:</strong><br>I = V / R = 10 V / 5 Ω = <strong>2 Amperes</strong>."
        },
        {
            id: "rep1_1_2",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 1.2: De acuerdo al diagrama, ¿cuál es la resistencia que, si se le aplica un voltaje de 60 volts, produciría una corriente de 6 amperes? (Nota de corrección: el enunciado del PDF dice 3A, pero la solución oficial se calculó con 6A).",
            imagenes: ["img/02.png"],
            respuesta: "<strong>Solución:</strong><br>R = V / I = 60 V / 6 A = <strong>10 ohms</strong>."
        },
        {
            id: "rep1_1_3",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 1.3: Si el foco del circuito del diagrama tiene una resistencia de 100 ohms y una corriente de 1 ampere, ¿cuál será el voltaje producido por la fuente?",
            imagenes: ["img/03.png"],
            respuesta: "<strong>Solución:</strong><br>V = R × I = 100 Ω × 1 A = <strong>100 Volts</strong>."
        },
        {
            id: "rep1_2_1_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 2.1.1: Calcular la corriente total que circula en el siguiente circuito con cargas en serie, considerando que la fuente es de 90 volts.",
            imagenes: ["img/04.png"],
            respuesta: "<strong>Solución:</strong><br>Rtotal = 10 + 5 + 2 + 8 + 20 = 45 Ω<br>I = 90 V / 45 Ω = <strong>2 Amperes</strong>."
        },
        {
            id: "rep1_2_2_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 2.2.1: Para el siguiente circuito, calcular la corriente aportada por las dos fuentes en serie.",
            imagenes: ["img/05.png"],
            respuesta: "<strong>Solución:</strong><br>Vtotal = 12 V + 5 V = 17 V (Se suman por la polaridad)<br>I = 17 V / 1 kΩ = <strong>17 mA</strong>."
        },
        {
            id: "rep1_2_2_2",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 2.2.2: Obtener el valor de la resistencia del circuito para que circule una corriente de 2.5 A si se tienen dos fuentes en serie.",
            imagenes: ["img/06.png"],
            respuesta: "<strong>Solución:</strong><br>Vtotal = 25 V - 5 V = 20 V (Se restan porque coinciden los polos negativos)<br>R = 20 V / 2.5 A = <strong>8 ohms</strong>."
        },
        {
            id: "rep1_2_2_3",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 2.2.3: Calcular la corriente que circula por un circuito serie que tiene una resistencia de carga de 1 ohm y dos fuentes de voltaje directo.",
            imagenes: ["img/07.png"],
            respuesta: "<strong>Solución:</strong><br>Vtotal = 6 V - 6 V = 0 V<br>I = 0 V / 1 Ω = <strong>0 Amperes</strong>."
        },
        {
            id: "rep1_3_1_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 3.1.1: Encontrar la corriente que circula por el circuito en paralelo mostrado, suponiendo que se tiene una fuente de 12V.",
            imagenes: ["img/08.png"],
            respuesta: "<strong>Solución:</strong><br>Por Método de Resistencia Total:<br>Rtotal = 1 / (1/1.5k + 1/10k + 1/4.7k + 1/100k) = 1.01 kΩ<br>I = 12 V / 1.01 kΩ = <strong>11.88 mA</strong>."
        },
        {
            id: "rep1_3_1_2",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 3.1.2: Calcular el voltaje que proporciona la fuente para que exista una corriente de 6 amperes fluyendo por todo el circuito. (Se muestran los 3 pasos de reducción del circuito).",
            imagenes: ["img/09.png", "img/10.png", "img/11.png"],
            respuesta: "<strong>Solución:</strong><br>R_derecha = (1k × 1k) / (1k + 1k) = 500 Ω<br>R_izquierda = 3k / 3 = 1 kΩ<br>Rtotal = (1k × 500) / (1k + 500) = 333.33 Ω<br>V = 333.33 Ω × 6 A = 1999.98 V ≈ <strong>2 kVolts</strong>."
        },
        {
            id: "rep1_4_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 4.1: Determinar el voltaje que provee la fuente en el circuito mixto, si existe una corriente circulando de 60mA. (Se muestran los 3 pasos de reducción del circuito).",
            imagenes: ["img/12.png", "img/13.png", "img/14.png"],
            respuesta: "<strong>Solución:</strong><br>1. R67 = (82×150)/(82+150) = 53.01 Ω<br>2. RA = 16 + 75 + 53.01 = 144.01 Ω<br>3. RB = 8.2 + 160 = 168.2 Ω<br>4. RAB = (144.01 × 168.2)/(144.01 + 168.2) = 77.58 Ω<br>5. RC = (51×130)/(51+130) = 36.62 Ω<br>6. Rtotal = 1k + 3k + 77.58 + 36.62 = 4114.2 Ω<br>V = 4114.2 Ω × 60 mA = <strong>246.85 V</strong>."
        },
        {
            id: "rep1_4_2",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 4.2: Encontrar la corriente suministrada por la fuente de 45V en el circuito mixto mostrado. (Se muestran los 4 pasos de reducción del circuito).",
            imagenes: ["img/15.png", "img/16.png", "img/17.png", "img/18.png"],
            respuesta: "<strong>Solución:</strong><br>1. R63 = (820×430)/(820+430) = 282.08 Ω<br>2. RA = 282.08 + 3.3 = 285.38 Ω<br>3. RB = (6.2×120)/(6.2+120) = 5.89 Ω<br>4. RAB = (285.38×5.89)/(285.38+5.89) = 5.77 Ω<br>5. RT = 1.5 + 5.77 = 7.27 Ω<br>I = 45 V / 7.27 Ω = <strong>6.18 Amperes</strong>."
        },
        {
            id: "rep1_5_1_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 5.1.1: Se tiene el siguiente circuito mixto, alimentado con una fuente DC de 110V. Calcular la potencia total. (Se muestran los 3 pasos de reducción del circuito).",
            imagenes: ["img/19.png", "img/20.png", "img/21.png"],
            respuesta: "<strong>Solución:</strong><br>1. Ra = (12.5×50)/(12.5+50) = 10 Ω<br>2. Rb = 20 / 2 = 10 Ω<br>3. RT = 10 + 10 + 1 + 1 = 22 Ω<br>4. Itotal = 110 V / 22 Ω = 5 A<br>Ptotal = V × I = 110 × 5 = <strong>550 Watts</strong>. (Revisar PDF para potencias individuales, ejemplo: P1=25W, P2=200W, P3=50W, P5=125W)."
        },
        {
            id: "rep1_5_2_1",
            fuente: "EJERCICIOS REPASO 1",
            texto: "Ejercicio 5.2.1: Una batería de 50V tiene una resistencia interna (Ri) de 2 ohms. Demostrar el teorema de máxima transferencia de potencia calculando la potencia en la carga (RL) cuando es 0.5 ohm, 2 ohms y 6 ohms.",
            imagenes: ["img/22.png"],
            respuesta: "<strong>Solución:</strong><br>RL = 0.5 Ω -> P = 200 W<br>RL = 2 Ω -> P = <strong>312.5 W (Potencia Máxima)</strong><br>RL = 6 Ω -> P = 234.375 W<br>Demostrado: La máxima potencia se transfiere cuando RL = Ri."
        },

        // ================= PDF: ACTIVIDAD 1 =================
        {
            id: "act1_q1",
            fuente: "ACTIVIDAD 1",
            texto: "1. De acuerdo al circuito, ¿cuánta corriente produciría un voltaje aplicado de 10 volts a través de una resistencia de 5 ohms?",
            imagenes: ["img/act1_q1.png"],
            respuesta: "<strong>Solución:</strong><br>I = 10 V / 5 Ω = <strong>2 A</strong>."
        },
        {
            id: "act1_q2",
            fuente: "ACTIVIDAD 1",
            texto: "2. Si el receptor del circuito del diagrama tiene una resistencia de 50 ohms y una corriente de 3A, ¿cuál será el voltaje producido por la fuente?",
            imagenes: ["img/act1_q2.png"],
            respuesta: "<strong>Solución:</strong><br>V = 3 A × 50 Ω = <strong>150 V</strong>."
        },
        {
            id: "act1_q3",
            fuente: "ACTIVIDAD 1",
            texto: "3. Para el siguiente circuito, calcular la corriente aportada por las dos fuentes en serie. (V1 = 50V, V2 = 15V, R1 = 500Ω)",
            imagenes: ["img/act1_q3.png"],
            respuesta: "<strong>Solución:</strong><br>Vt = 50 V + 15 V = 65 V.<br>I = 65 V / 500 Ω = <strong>0,13 A</strong> (o 130 mA)."
        },
        {
            id: "act1_q4",
            fuente: "ACTIVIDAD 1",
            texto: "4. Encontrar las magnitudes en cada parte del circuito paralelo (V = 12V; R1 = 1,5Ω; R2 = 10Ω; R3 = 4,7Ω; R4 = 100Ω).",
            imagenes: ["img/act1_q4.png"],
            respuesta: "<strong>Solución:</strong><br>Rt = 1,01 Ω. It = 11,87 A. Pt = 142,44 W."
        },
        {
            id: "act1_q5",
            fuente: "ACTIVIDAD 1",
            texto: "5. Encontrar las magnitudes en cada parte del circuito serie (V = 45V; R1 = 5Ω; R2 = 1Ω; R3 = 3Ω).",
            imagenes: ["img/act1_q5.png"],
            respuesta: "<strong>Solución:</strong><br>Rt = 9 Ω. It = 5 A. Pt = 225 W."
        },
        {
            id: "act1_q6",
            fuente: "ACTIVIDAD 1",
            texto: "6. En el siguiente circuito mixto: V=230V; R1=330Ω, R2=1kΩ, R3=200Ω, R4=30Ω, R5=20Ω.",
            imagenes: ["img/act1_q6.png"],
            respuesta: "<strong>Solución:</strong><br>Rt = 530 Ω. It = 0,434 A."
        },

        // ================= PDF: EJERCICIOS DE CONTINUA =================
        {
            id: "cont_q1",
            fuente: "EJERCICIOS CONTINUA",
            texto: "1. Calcula la Resistencia de un conductor de cobre de 2,5 mm² y 450 metros de longitud. (ρ_cU = 0,0172 Ω mm²/m)",
            imagenes: [],
            respuesta: "<strong>Solución:</strong><br>R = 0,0172 × (450 / 2,5) = <strong>3,096 Ω</strong>."
        },
        {
            id: "cont_q5",
            fuente: "EJERCICIOS CONTINUA",
            texto: "5. Calcula la resistencia de un conductor de cobre a 70°C, si sabemos que a 20°C tiene una resistencia de 5 Ω. (α_cU = 0,00393).",
            imagenes: [],
            respuesta: "<strong>Solución:</strong><br>R_70 = 5 × [1 + 0,00393 × (70 - 20)] = <strong>5,98 Ω</strong>."
        },
        {
            id: "cont_q13",
            fuente: "EJERCICIOS CONTINUA",
            texto: "13. Calcula la energía calorífica (Q) consumida por un calentador eléctrico de agua en 1 hora y 30 minutos, si sabemos que tiene una resistencia de 40 Ω y se conecta a la tensión de red de 230 V.",
            imagenes: [],
            respuesta: "<strong>Solución:</strong><br>P = 230² / 40 = 1322,5 W.<br>t = 5400 s.<br>Q = P × t = <strong>7.141.500 Julios (7.141,5 kJ)</strong>."
        },

        // ================= PDF: EJERCICIOS REPASO CORRIENTE CONTINUA 2 =================
        {
            id: "rep2_q1",
            fuente: "EJERCICIOS REPASO 2",
            texto: "1. Resuelve el siguiente circuito (Serie) y calcula: Rtotal; Itotal; V_AB; V_BC; V_CD; Ptotal; P1; P2; P3. Datos: V_T = 48V; R1 = 5Ω; R2 = 7Ω; R3 = 10Ω.",
            imagenes: ["img/rep2_q1.png"],
            respuesta: "<strong>Solución:</strong><br>R_T = <strong>22 Ω</strong><br>I_T = <strong>2,18 A</strong><br>V_AB = <strong>10,9 V</strong><br>V_BC = <strong>15,26 V</strong><br>V_CD = <strong>21,8 V</strong><br>P_T = <strong>104,64 W</strong>"
        }
    ];

    const container = document.getElementById('quiz-container');

    // Función para renderizar las preguntas
    preguntas.forEach((q, index) => {
        // Recuperar notas guardadas en localStorage
        const savedNotes = localStorage.getItem(`notes_${q.id}`) || '';

        // Construir etiquetas de imágenes o placeholder
        let imagesHTML = '';
        if (q.imagenes && q.imagenes.length > 0) {
            imagesHTML = '<div class="images-container">';
            q.imagenes.forEach(imgSrc => {
                imagesHTML += `<img src="${imgSrc}" alt="Circuito de la pregunta" class="question-image" onerror="this.outerHTML='<div class=\\'img-placeholder\\'>Falta la imagen: Asegúrate de que el archivo <b>${imgSrc}</b> exista en tu carpeta.</div>'">`;
            });
            imagesHTML += '</div>';
        }

        const cardHTML = `
            <div class="question-card">
                <span class="question-source">${q.fuente}</span>
                <div class="question-text">${q.texto}</div>
                
                ${imagesHTML}
                
                <textarea class="workspace" id="workspace_${q.id}" placeholder="Escribe aquí tus cálculos y resultados... (se guardan automáticamente)">${savedNotes}</textarea>
                
                <button class="btn-toggle" onclick="toggleAnswer('${q.id}')" id="btn_${q.id}">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    Ver Respuesta
                </button>
                
                <div class="answer-box" id="answer_${q.id}">
                    <h4>Respuesta Correcta:</h4>
                    <div>${q.respuesta}</div>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', cardHTML);

        // Event listener para auto-guardar las notas
        const textarea = document.getElementById(`workspace_${q.id}`);
        textarea.addEventListener('input', (e) => {
            localStorage.setItem(`notes_${q.id}`, e.target.value);
        });
    });

    // Función para mostrar/ocultar las respuestas
    function toggleAnswer(id) {
        const answerBox = document.getElementById(`answer_${id}`);
        const btn = document.getElementById(`btn_${id}`);
        
        if (answerBox.classList.contains('visible')) {
            answerBox.classList.remove('visible');
            btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg> Ver Respuesta`;
        } else {
            answerBox.classList.add('visible');
            btn.innerHTML = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg> Ocultar Respuesta`;
        }
    }
</script>

</body>
</html>
